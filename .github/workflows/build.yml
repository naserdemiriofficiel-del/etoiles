name: Compiler l'application Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Installe Gradle directement : pas besoin du fichier gradlew (qui perd son droit d'exécution
      # quand le dossier est envoyé par le site web de GitHub).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Vérifier que le projet est bien à la racine du dépôt
        run: |
          ls -la
          test -f settings.gradle.kts || { echo "settings.gradle.kts est introuvable à la racine du dépôt : le projet n'a pas été envoyé en entier."; exit 1; }

      - name: APK de test (installable directement sur un téléphone)
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk-test
          path: app/build/outputs/apk/debug/app-debug.apk

      # Fichier à envoyer sur Google Play : nécessite les 4 secrets décrits dans LISEZMOI.md
      - name: Préparer la clé de signature
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AAB signé pour Google Play
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.present == 'true'
        with:
          name: aab-google-play
          path: app/build/outputs/bundle/release/app-release.aab
